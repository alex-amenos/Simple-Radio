apply from: "$rootDir/buildSystem/gradle/common-android-feature.gradle"

android {
    resourcePrefix = 'radioplayer'
    namespace = 'com.alxnophis.jetpack.radioplayer'
}

dependencies {
    implementation project(Modules.SHARED_API)
    implementation project(Modules.SHARED_STORAGE)
    implementation libs.retrofit
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.session
    implementation libs.structured.coroutines.annotations

    testImplementation(libs.bundles.kotest)
    testImplementation libs.androidx.media3.test.utils
}
