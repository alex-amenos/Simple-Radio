apply from: "$rootDir/buildSystem/gradle/common-android-feature.gradle"

android {
    resourcePrefix = 'root'
    namespace = 'com.alxnophis.simpleradio.root'
}

dependencies {
    implementation project(Modules.FEATURE_FAVORITES)
    implementation project(Modules.FEATURE_HOME)
    implementation project(Modules.FEATURE_RADIO_PLAYER)
    implementation project(Modules.FEATURE_SEARCH)
    implementation project(Modules.FEATURE_SETTINGS)
    implementation project(Modules.SHARED_STORAGE)
    implementation libs.androidx.material3.adaptive.navigation3
    implementation libs.androidx.core.splashscreen
}
