// Kover 0.9.x multi-module coverage aggregation
// https://kotlin.github.io/kotlinx-kover/gradle-plugin/
dependencies {
    kover(project(':feature:home'))
    kover(project(':feature:root'))
    kover(project(':feature:settings'))
    kover(project(':shared:core'))
    kover(project(':shared:kotlin'))
}

kover {
    reports {
        filters {
            includes {
                classes('com.alxnophis.simpleradio.*')
            }
            excludes {
                classes(
                        'com.alxnophis.simpleradio.core.base.*',
                        'com.alxnophis.simpleradio.*.di.*',
                        'com.alxnophis.simpleradio.di.*',
                        'com.alxnophis.simpleradio.router.*',
                        'com.alxnophis.simpleradio.*.ui.navigation.*',
                        '*Activity',
                        'BuildConfig',
                        '*Mother',
                        '*NavGraph$*',
                )
            }
        }
    }
}
